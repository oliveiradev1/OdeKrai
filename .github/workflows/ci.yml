name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Validação Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Configurar Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependências JavaScript
        run: npm ci

      - name: Verificar codificação dos arquivos
        run: npm run check:encoding

      - name: Verificar funcionalidades não permitidas na release
        run: npm run check:release-features

      - name: Verificar consistência da versão
        run: npm run check:version

      - name: Verificar fontes e domínios do catálogo MCP
        run: npm run check:mcp-catalog

      - name: Executar testes
        run: npm test

      - name: Verificar formatação
        run: npm run format:check

      - name: Verificar comando exclusivo de debug
        run: npm run check:debug-command

      - name: Verificar criação assíncrona de janelas Tauri
        run: npm run check:tauri-window-commands

      - name: Verificar operações bloqueantes em comandos Tauri síncronos
        run: npm run check:blocking-commands

      - name: Verificar ACL das APIs de janela no frontend
        run: npm run check:window-api-acl

      - name: Verificar formatação Rust
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Testar biblioteca Rust
        run: cargo test --lib
        working-directory: src-tauri

      - name: Testar janelas com runtime simulado Tauri
        run: cargo test --test mock_window --features mock-window-tests
        working-directory: src-tauri

      - name: Executar Clippy
        run: cargo clippy --all-targets --features mock-window-tests -- -D warnings
        working-directory: src-tauri

      - name: Compilar a interface
        run: npm run build
