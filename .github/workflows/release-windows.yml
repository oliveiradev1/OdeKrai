name: Build Windows NSIS installer artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Configurar Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependências JavaScript
        run: npm ci

      - name: Validar versão da tag e configuração de release
        shell: pwsh
        run: |
          npm run check:version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "A tag $env:GITHUB_REF_NAME não corresponde à versão v$version."
          }
          "ODEKRAI_VERSION=$version" >> $env:GITHUB_ENV

      - name: Bloquear DevTools no build de release
        shell: pwsh
        run: |
          npm run check:release-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $features = cargo tree --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --no-default-features -e features -i tauri | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($features -match 'tauri feature "devtools"') {
            throw 'DevTools está ativo nas features do build de release.'
          }

      - name: Compilar e verificar os arquivos incorporados
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-release-artifact.mjs dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gerar o instalador NSIS sem assinatura
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Calcular hash e validar o artefato
        shell: pwsh
        run: |
          $installerName = "OdeKrai_$($env:ODEKRAI_VERSION)_x64-setup.exe"
          $installer = Join-Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' $installerName
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Instalador NSIS ausente: $installer"
          }
          $stage = Join-Path $env:RUNNER_TEMP 'odekrai-nsis-release'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination (Join-Path $stage $installerName)
          $hash = (Get-FileHash -LiteralPath (Join-Path $stage $installerName) -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $stage 'SHA256SUMS.txt'), "$hash  $installerName`n", $utf8NoBom)
          node scripts/check-release-artifact.mjs --release $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Disponibilizar artefato da execução
        uses: actions/upload-artifact@v7
        with:
          name: odekrai-nsis-${{ github.run_id }}
          path: ${{ runner.temp }}/odekrai-nsis-release/
          if-no-files-found: error
          retention-days: 30
