[package]
name = "odekrai"
version = "0.16.0"
description = "OdeKrai para Windows"
authors = ["Anceryx"]
license = "MIT"
edition = "2021"
default-run = "odekrai"

[features]
diagnostics = ["tauri/devtools"]
mock-window-tests = []

[lib]
name = "odekrai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "mock_window"
path = "tests/mock_window.rs"
required-features = ["mock-window-tests"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", features = ["clock"] }
calamine = "0.36.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
log = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
dom_query = { version = "0.28.0", default-features = true }
rusqlite = { version = "0.38", features = ["bundled"] }
rust_xlsxwriter = "0.101.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
wmi = "0.18.4"
